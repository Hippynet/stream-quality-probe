[package]
name = "streamprobe"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Live diagnostics for internet radio streams (Icecast, Shoutcast, HLS)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Hippynet/stream-quality-probe"
homepage = "https://github.com/Hippynet/stream-quality-probe"
readme = "README.md"
keywords = ["radio", "icecast", "shoutcast", "streaming", "diagnostics"]
categories = ["command-line-utilities", "multimedia::audio"]
publish = false # distributed as GitHub Release binaries only

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ctrlc = { version = "3", features = ["termination"] }
ebur128 = "0.1"
regex = "1"
rustfft = "6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = { version = "1", features = ["preserve_order"] }
unicode-width = "0.2.2"
url = "2"
webpki-roots = "1"
x509-parser = "0.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
