name: CI

# Pull-request and main gate: formatting, clippy and unit tests on Linux and
# macOS, the minimum supported Rust version, and dependency policy
# (cargo-deny plus the third-party licence notices). Nothing here builds or
# publishes release binaries; releases are tag-driven (release.yml).
#
# Every job runs on a GitHub-hosted runner. This is a public repository, so
# pull requests from forks must never reach a self-hosted machine.
#
# The end-to-end fault suite (make test-faults) needs ffmpeg and streams in
# real time for about two minutes, so it runs locally before tagging.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked
      - name: Shell scripts
        if: runner.os == 'Linux' # shellcheck ships with the Ubuntu runner image
        run: |
          sh -n install.sh
          shellcheck -s sh install.sh tests/*.sh

  msrv:
    name: minimum Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: msrv
        name: Read rust-version from Cargo.toml
        run: |
          set -euo pipefail
          v="$(sed -n 's/^rust-version = "\([0-9.]*\)"/\1/p' Cargo.toml | head -1)"
          [ -n "$v" ] || { echo "::error::no rust-version in Cargo.toml"; exit 1; }
          echo "version=$v" >>"$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Check with the minimum supported Rust version
        run: cargo check --locked --all-targets

  deny:
    name: cargo-deny, licence notices
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - name: Install cargo-deny (release binary, pinned by hash)
        env:
          # Bump deliberately: a release at least two weeks old, and the
          # SHA-256 of its x86_64-unknown-linux-musl tarball.
          DENY_VERSION: "0.20.2"
          DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          set -euo pipefail
          name="cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/$name.tar.gz"
          echo "$DENY_SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >>"$GITHUB_PATH"
      - name: Advisories, licences, bans, sources
        run: cargo deny --locked check --show-stats
      - name: Every dependency has a licence text (all release targets)
        run: |
          python3 scripts/third_party_licenses.py \
            --target x86_64-unknown-linux-musl --target aarch64-unknown-linux-musl \
            --target aarch64-apple-darwin --target x86_64-apple-darwin \
            -o "$RUNNER_TEMP/THIRD_PARTY_LICENSES.txt"
